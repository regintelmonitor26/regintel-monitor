name: Run regulatory monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * 4' # JST Friday 06:00

permissions:
  contents: write

concurrency:
  group: regulatory-monitor
  cancel-in-progress: false

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run monitor
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECIPIENTS: ${{ secrets.GMAIL_RECIPIENTS }}
        run: python monitor.py

      - name: Commit updated monitor state
        run: |
          if [ ! -f data/processed_urls.json ] || [ ! -f data/pmda_ich_link.json ]; then
            echo "One or more state files were not created."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed_urls.json data/pmda_ich_link.json
          if git diff --cached --quiet; then
            echo "Monitor state is unchanged."
            exit 0
          fi
          git commit -m "Update regulatory monitor state"
          git push
