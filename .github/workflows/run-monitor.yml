name: Run regulatory monitor

on:
  workflow_dispatch:
    inputs:
      send_test_email:
        description: Send current MHLW and PMDA links without updating state
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 21 * * 4' # JST Friday 06:00

permissions:
  contents: write

concurrency:
  group: regulatory-monitor
  cancel-in-progress: false

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run monitor
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECIPIENTS: ${{ secrets.GMAIL_RECIPIENTS }}
          SEND_TEST_EMAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_email }}
        run: python monitor.py

      - name: Commit updated monitor state
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.send_test_email }}
        run: |
          state_files=(
            data/processed_urls.json
            data/pmda_ich_link.json
            data/jpma_ich_links.json
            data/jpma_results_links.json
            data/jpma_messages_links.json
          )
          for state_file in "${state_files[@]}"; do
            if [ ! -f "$state_file" ]; then
              echo "State file was not created: $state_file"
              exit 1
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${state_files[@]}"
          if git diff --cached --quiet; then
            echo "Monitor state is unchanged."
            exit 0
          fi
          git commit -m "Update regulatory monitor state"
          git push
